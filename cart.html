<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉLITE | Cart</title>


<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:'Poppins',sans-serif;
background:#0b0b0b;
color:white;

}


/* NAVBAR */

header{

position:fixed;
top:0;
width:100%;
z-index:1000;

}


nav{

height:90px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 8%;

background:#000;

}


.logo{

font-family:'Cormorant Garamond',serif;

font-size:40px;

letter-spacing:5px;

color:#d4af37;

}


.logo i{

margin-right:10px;

}


nav a{

text-decoration:none;

color:white;

font-size:18px;

}


nav a:hover{

color:#d4af37;

}



/* BANNER */


.cart-banner{

margin-top:90px;

height:350px;

background:

linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.65)
),

url("https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1600");


background-size:cover;

background-position:center;


display:flex;

justify-content:center;

align-items:center;

}



.cart-banner h1{

font-family:'Cormorant Garamond',serif;

font-size:75px;

color:#d4af37;

}




/* CART */


.cart-section{

padding:70px 8%;

}



.cart-container{

max-width:900px;

margin:auto;

background:#171717;

padding:40px;

border-radius:25px;

box-shadow:0 10px 35px rgba(212,175,55,.25);

}



.cart-heading{

font-family:'Cormorant Garamond',serif;

font-size:45px;

color:#d4af37;

margin-bottom:30px;

}



.cart-item{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 0;

border-bottom:1px solid #333;

}



.item-name{

font-size:22px;

}



.item-price{

color:#d4af37;

font-size:20px;

}



.remove-btn{

background:#8b0000;

border:none;

padding:8px 20px;

color:white;

border-radius:25px;

cursor:pointer;

}



.remove-btn:hover{

background:red;

}




.empty-cart{

text-align:center;

color:#aaa;

padding:50px;

font-size:22px;

}



.total{

text-align:right;

font-size:30px;

color:#d4af37;

margin-top:35px;

font-weight:bold;

}



.order-btn{

display:block;

width:max-content;

margin:40px auto 0;

background:#d4af37;

color:black;

padding:15px 45px;

border-radius:40px;

text-decoration:none;

font-weight:600;

}



.order-btn:hover{

background:white;

}





footer{

background:#000;

text-align:center;

padding:30px;

color:#aaa;

}


footer h2{

font-family:'Cormorant Garamond',serif;

font-size:35px;

color:#d4af37;

}



</style>


</head>



<body>



<header>


<nav>


<div class="logo">

🍴 ÉLITE

</div>



<a href="menu.html">

← Back To Menu

</a>



</nav>


</header>







<section class="cart-banner">


<h1>Your Cart</h1>


</section>








<section class="cart-section">


<div class="cart-container">



<div class="cart-heading">

Selected Dishes

</div>



<div id="cartItems">


</div>




<div class="total" id="totalAmount">

Total : ₹0

</div>




<a href="order-success.html"
class="order-btn"
onclick="orderPlaced()">

Order Now

</a>




</div>


</section>








<footer>


<h2>ÉLITE Restaurant</h2>

<p>Smart Restaurant Menu System</p>


</footer>








<script>


let cart = JSON.parse(localStorage.getItem("cart")) || [];


let cartItems = document.getElementById("cartItems");

let totalAmount = document.getElementById("totalAmount");





function displayCart(){


cartItems.innerHTML="";


let total=0;



if(cart.length===0){


cartItems.innerHTML=`

<div class="empty-cart">

Your cart is empty

<br><br>

Please select dishes from menu

</div>

`;


totalAmount.innerHTML="Total : ₹0";


return;


}





cart.forEach((item,index)=>{


total += Number(item.price);



cartItems.innerHTML += `


<div class="cart-item">


<div>


<div class="item-name">

${item.name}

</div>



<div class="item-price">

₹${item.price}

</div>



</div>



<button class="remove-btn" onclick="removeItem(${index})">

Remove

</button>



</div>


`;



});



totalAmount.innerHTML="Total : ₹"+total;


}





function removeItem(index){


cart.splice(index,1);


localStorage.setItem(

"cart",

JSON.stringify(cart)

);


displayCart();


}




function orderPlaced(){


localStorage.removeItem("cart");


}





displayCart();



</script>



</body>


</html>
